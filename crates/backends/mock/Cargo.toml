[package]
name = "flash-backend-mock"
version = "0.1.0"
edition = "2021"
authors = ["Flash Programmer GUI Team"]
description = "Simulated NOR flash backend with deterministic fault injection, for testing without hardware"
license = "MIT OR Apache-2.0"

[lib]
name = "flash_backend_mock"
path = "src/lib.rs"

[dependencies]
flash-core = { path = "../../flash-core" }
firmware-parser = { path = "../../firmware-parser" }
crc32fast = "1.4"
