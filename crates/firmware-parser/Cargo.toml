[package]
name = "firmware-parser"
version = "0.1.0"
edition = "2021"
authors = ["Flash Programmer GUI Team"]
description = "Intel HEX and raw binary firmware parser, segment consolidator, and checksum engine"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.4"
md-5 = "0.10"
sha2 = "0.10"
