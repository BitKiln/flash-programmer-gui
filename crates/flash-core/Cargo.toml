[package]
name = "flash-core"
version = "0.1.0"
edition = "2021"
authors = ["Flash Programmer GUI Team"]
description = "Modular flash programming core: backend traits, registry, orchestration, batch runner, and profiles"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.4"
toml = "0.8"
directories = "5.0"
firmware-parser = { path = "../firmware-parser" }

[dev-dependencies]
